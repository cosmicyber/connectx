<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="ConnectX brings your messages, calls, and people together." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ConnectX" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ConnectX — stay close</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <aside class="nav-rail" aria-label="Main navigation">
        <a class="brand-mark" href="#" aria-label="ConnectX home">
          <span class="brand-symbol"><span></span><span></span><span></span></span>
        </a>
        <nav class="rail-links">
          <button class="rail-link active" data-view="chats" aria-label="Chats" title="Chats">
            <span class="icon" data-icon="chat"></span><span class="rail-label">Chats</span>
          </button>
          <button class="rail-link" data-view="calls" aria-label="Calls" title="Calls">
            <span class="icon" data-icon="phone"></span><span class="rail-label">Calls</span>
          </button>
          <button class="rail-link" data-view="contacts" aria-label="Contacts" title="Contacts">
            <span class="icon" data-icon="users"></span><span class="rail-label">People</span>
          </button>
          <button class="rail-link" data-view="wallet" aria-label="Wallet" title="Wallet">
            <span class="icon" data-icon="wallet"></span><span class="rail-label">Wallet</span>
          </button>
        </nav>
        <div class="rail-bottom">
          <button class="rail-link" data-view="settings" aria-label="Settings" title="Settings">
            <span class="icon" data-icon="settings"></span><span class="rail-label">Settings</span>
          </button>
          <button class="self-avatar avatar avatar-self" data-view="settings" aria-label="Your profile">AM</button>
        </div>
      </aside>

      <aside class="inbox-panel" id="inbox-panel">
        <div class="inbox-top">
          <div class="inbox-brand-row">
            <div>
              <p class="eyebrow">YOUR SPACE</p>
              <h1 id="section-title">Messages<span class="title-dot">.</span></h1>
            </div>
            <button class="icon-button new-chat-button" id="new-chat" aria-label="Start a new chat" title="New chat">
              <span class="icon" data-icon="edit"></span>
            </button>
          </div>
          <label class="search-box">
            <span class="icon" data-icon="search"></span>
            <input id="search" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations" />
            <kbd>/</kbd>
          </label>
          <div class="inbox-tabs" role="tablist" aria-label="Conversation filter">
            <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All <span id="all-count">0</span></button>
            <button class="filter-tab" data-filter="unread" role="tab" aria-selected="false">Unread</button>
            <button class="filter-tab" data-filter="favorites" role="tab" aria-selected="false">Favorites</button>
          </div>
        </div>
        <div class="conversation-list" id="conversation-list" aria-label="Conversations"></div>
        <div class="inbox-footer">
          <span class="connection-indicator"></span>
          <span>Everything is up to date</span>
          <button class="icon-button tiny" aria-label="More inbox options" id="inbox-more"><span class="icon" data-icon="more"></span></button>
        </div>
      </aside>

      <main class="main-panel" id="main-panel">
        <header class="conversation-header" id="conversation-header">
          <button class="icon-button back-button" id="back-to-list" aria-label="Back to conversations"><span class="icon" data-icon="arrow-left"></span></button>
          <button class="header-person" id="header-person" aria-label="Open contact details">
            <span class="avatar avatar-lg" id="header-avatar"></span>
            <span class="header-person-copy"><strong id="header-name"></strong><span id="header-presence"></span></span>
          </button>
          <div class="header-actions">
            <span class="route-label"><span class="route-dot"></span> ConnectX call</span>
            <button class="icon-button call-action" id="voice-call" aria-label="Start voice call" title="Voice call"><span class="icon" data-icon="phone"></span></button>
            <button class="icon-button call-action video-action" id="video-call" aria-label="Start video call" title="Video call"><span class="icon" data-icon="video"></span></button>
            <span class="header-divider"></span>
            <button class="icon-button details-action" id="details-toggle" aria-label="Toggle contact details" title="Contact details"><span class="icon" data-icon="panel"></span></button>
            <button class="icon-button header-more" id="chat-more" aria-label="More conversation options"><span class="icon" data-icon="more"></span></button>
          </div>
        </header>
        <div class="thread-layout">
          <section class="thread-column" aria-label="Conversation">
            <div class="thread-scroll" id="thread-scroll">
              <div class="thread-date"><span></span><small>TODAY</small><span></span></div>
              <div class="message-list" id="message-list"></div>
            </div>
            <div class="composer-wrap">
              <div class="reply-context hidden" id="reply-context"></div>
              <form class="composer" id="composer">
                <button class="composer-tool attach-button" type="button" id="attach-button" aria-label="Attach a file" title="Attach a file"><span class="icon" data-icon="plus"></span></button>
                <input type="file" id="file-input" hidden />
                <textarea id="message-input" rows="1" placeholder="Write a message…" aria-label="Write a message"></textarea>
                <button class="composer-tool emoji-button" type="button" id="emoji-button" aria-label="Add an emoji" title="Add an emoji"><span class="icon" data-icon="smile"></span></button>
                <button class="send-button" type="submit" aria-label="Send message"><span class="icon" data-icon="send"></span></button>
              </form>
              <div class="composer-hint"><span>Press <kbd>Enter</kbd> to send</span><span class="secure-note"><span class="icon" data-icon="lock"></span> Your conversations, your space</span></div>
            </div>
          </section>
          <aside class="details-panel" id="details-panel" aria-label="Contact details">
            <button class="details-close icon-button" id="details-close" aria-label="Close details"><span class="icon" data-icon="close"></span></button>
            <div class="profile-card">
              <div class="profile-orbit"><span class="avatar avatar-profile" id="profile-avatar"></span><i class="profile-online" id="profile-online"></i></div>
              <h2 id="profile-name"></h2>
              <p class="profile-handle" id="profile-handle"></p>
              <p class="profile-status" id="profile-status"></p>
              <div class="profile-quick-actions">
                <button id="profile-message"><span class="icon" data-icon="chat"></span><span>Message</span></button>
                <button id="profile-audio"><span class="icon" data-icon="phone"></span><span>Voice</span></button>
                <button id="profile-video"><span class="icon" data-icon="video"></span><span>Video</span></button>
              </div>
            </div>
            <div class="detail-section">
              <p class="detail-label">ABOUT</p>
              <p class="contact-bio" id="contact-bio"></p>
            </div>
            <div class="detail-section contact-number">
              <p class="detail-label">PHONE NUMBER <span class="icon" data-icon="lock"></span></p>
              <p id="contact-phone"></p><small>Only visible to you</small>
            </div>
            <div class="detail-section shared-section">
              <div><p class="detail-label">SHARED MEDIA</p><span>12</span></div>
              <div class="media-preview"><span class="media-tile media-one">✦</span><span class="media-tile media-two">◒</span><span class="media-tile media-three">↗</span></div>
              <button id="shared-media">View all media <span class="icon" data-icon="chevron"></span></button>
            </div>
            <div class="detail-bottom">
              <button id="mute-chat"><span class="icon" data-icon="bell"></span> Mute notifications</button>
              <button class="danger-action" id="block-contact"><span class="icon" data-icon="block"></span> Block contact</button>
            </div>
          </aside>
        </div>
        <section class="page-view hidden" id="page-view" aria-live="polite"></section>
      </main>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-link active" data-view="chats"><span class="icon" data-icon="chat"></span><span>Chats</span></button>
        <button class="mobile-nav-link" data-view="calls"><span class="icon" data-icon="phone"></span><span>Calls</span></button>
        <button class="mobile-nav-link" data-view="contacts"><span class="icon" data-icon="users"></span><span>People</span></button>
        <button class="mobile-nav-link" data-view="wallet"><span class="icon" data-icon="wallet"></span><span>Wallet</span></button>
        <button class="mobile-nav-link" data-view="settings"><span class="icon" data-icon="settings"></span><span>Me</span></button>
      </nav>
    </div>
    <div id="modal-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="./app.js" defer></script>
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch((error) => console.warn("ConnectX offline support could not be enabled.", error)));
      }
    </script>
  </body>
</html>
